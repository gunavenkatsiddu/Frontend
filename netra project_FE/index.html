<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content=""width=device-width, intial-scale="1.0">
    <title>NETRA ROBOT MONITORING SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<header class="topbar">
  <div class="brand">
    <div class="brand-logo">N</div>
    <div>
      <h1>NETRA</h1>
      <p>ROBOT MISSION CONTROL</p>
    </div>
  </div>
  <nav>
    <a href="#dashboard">Dashboard</a>
    <a href="#fleet">Fleet</a>
    <a href="#telemetry">Telemetry</a>
    <a href="#alerts">Alerts</a>
  </nav>
  <div class="header-right">
    <span class="online-dot"></span>
    <span>SYSTEM ONLINE</span>
    
  </div>
  <button id="dispatch-open" type="button">
    + Dispatch Mission</button>
</header>
<script src="script.js"></script>

<section class="kpi-grid">
   <article class="kpi-card">
    <span>ROVERS ONLINE</span>
    <h2 id="online-count">6 / 6</h2>
    <p>Active rover units</p>
    </article>

 <div class="kpi-card">
        <h4>AVERAGE BATTERY</h4>
        <h2>76%</h2>
        <p>Fleet battery level</p>
    </div>

    <div class="kpi-card">
        <h4>OPEN ALERTS</h4>
        <h2>0</h2>
        <p>Requires attention</p>
    </div>

    <div class="kpi-card">
        <h4>DISTANCE TODAY</h4>
        <h2>13.6 km</h2>
        <p>Total simulated distance</p>
    </div>

</section>

</body>
</html
