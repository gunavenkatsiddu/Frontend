<html>
    <body>
        <h2>Addtion of two numbers</h2>

        <input type="number" id="num1" placeholder="Enter first number" /><br /><br />
         <input type="number" id="num2" placeholder="Enter second number" /><br /><br />
         <button onclick="addNumbers()">Add</button>
         <button onclick="mulNumbers()">Multiply</button>

         <h3 id="result"></h3>

         <script>
            function addNumbers(){
              let a = Number(document.getElementById("num1").value);
               let b = Number(document.getElementById("num2").value);
              let sum = a + b;
              document.getElementById("result").innerHTML = "Addition of a , b = " + sum;
            
            }
             function mulNumbers(){
              let a = Number(document.getElementById("num1").value);
               let b = Number(document.getElementById("num2").value);
              let sum = a * b;
              document.getElementById("result").innerHTML = "Multiplication of a , b = " + sum;
            
            }
         </script>
    </body>
</html>
